<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Нуклеон</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            background: #020408;
            position: fixed;
            top: 0;
            left: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            display: block;
            cursor: default;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    <script src="gm-config.js"></script>
    <script>
        // =================== GAMEMONETIZE SDK INTEGRATION ===================
        window.SDK_OPTIONS = {
            gameId: window.GM_GAME_ID || 'REPLACE_WITH_GAMEMONETIZE_GAME_ID',
            onEvent: function(event) {
                // Pause/resume logic will be handled globally
                if (event.name === 'SDK_GAME_PAUSE') {
                    // Set a global flag that game.js can check
                    window.gmAdPaused = true;
                } else if (event.name === 'SDK_GAME_START') {
                    window.gmAdPaused = false;
                }
            }
        };
        
        // Show banner on game over
        window.gmShowBannerOnGameOver = function() {
            if (typeof sdk !== 'undefined' && sdk.showBanner) {
                setTimeout(function() { sdk.showBanner(); }, 500);
            }
        };
        
        // Initial banner after load
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (typeof sdk !== 'undefined' && sdk.showBanner) {
                    sdk.showBanner();
                }
            }, 3000);
        });
    </script>
    <script src="https://api.gamemonetize.com/sdk.js"></script>
    <script src="game.js"></script>
</body>
</html>
